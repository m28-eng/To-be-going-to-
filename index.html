let state={screen:'intro',index:0,score:0,earned:[],sound:true,bonus:''};
let selection={option:null,tiles:[],mode:null,text:'',hint:false,attempts:0,solved:false,feedback:null};
const view=document.getElementById('view'), headerScore=document.getElementById('headerScore'),soundBtn=document.getElementById('soundBtn');
function esc(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\b(i'm)\b/g,'i am').replace(/\b(he's)\b/g,'he is').replace(/\b(she's)\b/g,'she is').replace(/\b(it's)\b/g,'it is').replace(/\b(we're)\b/g,'we are').replace(/\b(they're)\b/g,'they are').replace(/\b(you're)\b/g,'you are').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function resetQuestion(){selection={option:null,tiles:[],mode:null,text:'',hint:false,attempts:0,solved:false,feedback:null};}
function load(){try{let o=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(o&&Number.isInteger(o.index)&&o.index>=0&&o.index<=30&&Number.isFinite(o.score)&&Array.isArray(o.earned)&&['intro','play','stage','finish'].includes(o.screen)){state={...state,...o};if(state.screen==='play'&&o.questionProgress){selection={...selection,...o.questionProgress}}else resetQuestion();if(state.screen==='play'&&state.index>=30)state.screen='finish';}}catch(e){}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({...state,questionProgress:selection}))}catch(e){}}
function finishReset(){if(!confirm('Start a new game? Your saved score and progress will be reset.'))return;state={screen:'intro',index:0,score:0,earned:[],sound:state.sound,bonus:''};resetQuestion();save();render()}
let audioContext=null;
function sound(type){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioContext=audioContext||new C();let now=audioContext.currentTime;let notes=type==='good'?[440,550,660]:type==='win'?[523,659,784,988]:[220,185];notes.forEach((hz,i)=>{let osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type=type==='bad'?'sine':'triangle';osc.frequency.value=hz;gain.gain.setValueAtTime(0,now+i*.11);gain.gain.linearRampToValueAtTime(.075,now+i*.11+.018);gain.gain.exponentialRampToValueAtTime(.001,now+i*.11+.18);osc.connect(gain);gain.connect(audioContext.destination);osc.start(now+i*.11);osc.stop(now+i*.11+.21)})}catch(e){}}
soundBtn.addEventListener('click',()=>{state.sound=!state.sound;soundBtn.textContent=state.sound?'🔊':'🔇';soundBtn.setAttribute('aria-label',state.sound?'Mute sound':'Unmute sound');save()});
function startNew(){state.screen='play';state.index=0;state.score=0;state.earned=[];state.bonus='';resetQuestion();save();render()}
function continueGame(){state.screen=state.index>=30?'finish':'play';resetQuestion();save();render()}
function currentStage(){return Math.floor(Math.min(state.index,29)/6)}
function stageScore(stage){return state.earned.slice(stage*6,(stage+1)*6).reduce((a,b)=>a+b,0)}
function stageStars(stage){let x=stageScore(stage);return x>=51?3:x>=32?2:1}
function starString(n){return '⭐'.repeat(n)+'☆'.repeat(3-n)}
function renderIntro(){return `<div class="hero-layout"><section class="hero-copy"><span class="eyebrow">✦ A magical cooking adventure ✦</span><h1>GOING TO<br><span class="emph">KITCHEN!</span></h1><p class="lead">Help our little chef prepare a <strong>future feast</strong>! Learn to talk about plans and predictions with <strong>be going to</strong>.</p><div class="flourish">✧ ───── 🍅 ───── ✧</div><div class="facts"><div class="fact">🎮 <b>5</b> missions</div><div class="fact">🧩 <b>30</b> tasks</div><div class="fact">🎓 <b>A1–A2</b></div><div class="fact">⭐ Scores & rewards</div></div><div class="button-row"><button class="btn primary" id="playBtn">LET'S COOK! →</button>${state.earned.length>0||state.index>0?'<button class="btn outline" id="continueBtn">↪ Continue my game</button>':''}</div><p class="tiny-note">💡 No login needed. Tap, arrange words and type. Your progress is saved automatically.</p><div class="stage-road">${stages.map((s,i)=>`<div class="stage-dot ${state.earned.length>=(i+1)*6?'done':i===currentStage()&&state.earned.length?'active':'locked'}"><div class="num">${s.icon}</div><small>${s.short}</small></div>`).join('')}</div></section><aside class="hero-art"><span class="hero-small-star">✨</span><img class="hero-img" alt="A smiling blue-grey mouse chef holding a large wooden spoon, based on the supplied character image" src="${HERO_SRC}"><div class="hero-note"><span>🧑‍🍳</span>“We are going to make something amazing!”</div></aside></div>`}
function renderPlay(){let stage=currentStage(),info=stages[stage],q=data[state.index],n=(state.index%6)+1,percent=(state.index/30)*100;
let content='';if(q.kind==='choice')content=`<div class="choices" role="group" aria-label="Choose an answer">${q.options.map((x,i)=>`<button class="choice ${selection.option===i?'selected':''}" data-choice="${i}" aria-pressed="${selection.option===i}" ${selection.solved?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(x)}</span></button>`).join('')}</div>`;
if(q.kind==='order'){let slots=selection.tiles.map((t,j)=>`<button type="button" class="tile" data-undo="${j}" ${selection.solved?'disabled':''} title="Tap to remove this word">${esc(q.tokens[t])} ×</button>`).join('');content=`<div class="sentence-caption">YOUR SENTENCE · tap a word to undo</div><div class="sentence-box" aria-label="Sentence being built">${slots||'<div class="placeholder">Your words will appear here... ✨</div>'}</div><div class="sentence-caption">TAP THE WORDS IN ORDER</div><div class="word-bank">${q.tokens.map((t,i)=>`<button class="tile ${selection.tiles.includes(i)?'used':''}" data-tile="${i}" ${selection.solved||selection.tiles.includes(i)?'disabled':''}>${esc(t)}</button>`).join('')}</div>`;}
if(q.kind==='write'){content=`<div class="sentence-caption">1 · Is it a plan or a prediction?</div><div class="mode-switch"><button class="mode ${selection.mode==='plan'?'on':''}" data-mode="plan" aria-pressed="${selection.mode==='plan'}" ${selection.solved?'disabled':''}>📅 A plan</button><button class="mode ${selection.mode==='prediction'?'on':''}" data-mode="prediction" aria-pressed="${selection.mode==='prediction'}" ${selection.solved?'disabled':''}>🔮 A prediction</button></div><div class="sentence-caption">2 · Write a complete sentence</div><div class="cue">Clues: ${esc(q.cue)}</div><input class="text-answer" id="written" type="text" maxlength="160" autocomplete="off" spellcheck="false" placeholder="e.g. He is going to cook..." value="${esc(selection.text)}" ${selection.solved?'disabled':''}><div class="tip">Use <strong>am / is / are + going to + verb</strong>. Finish with a full stop.</div>`;}
let feedback=selection.feedback?`<div class="feedback ${selection.feedback.good?'good':'bad'}" role="status"><div class="fb-head">${selection.feedback.good?'🌟 Delicious!':'🍋 Not quite. Try again!'}</div>${esc(selection.feedback.text)}</div>`:'';
return `<div class="play-head"><div><div class="chapter-tag">${info.tag}</div><div class="stages-mini">${stages.map((s,i)=>`<div title="${s.name}" class="stage-mini ${i<stage?'done':i===stage?'live':''}"></div>`).join('')}</div></div><div><div class="progress-label">Recipe progress: ${state.index}/30</div><div class="progress-rail"><div class="progress-fill" style="width:${percent}%"></div></div></div></div><div class="play-title"><h2>${info.icon} ${info.name}</h2><p class="subcopy">${info.subtitle}</p></div><div class="play-layout"><section class="question-card"><div class="question-top"><span class="question-num">Question ${n} / 6</span><span class="question-theme">${q.kind==='write'?'✨ Future plans':'👨‍🍳 Kitchen English'}</span></div><div class="question-body"><div class="scene"><div class="emoji">${q.emoji}</div><div class="situation"><small>THE CHEF'S STORY</small>${esc(q.scene)}</div></div><div class="question-label">${esc(q.prompt||'Complete the sentence.')}</div>${content}${selection.hint?`<div class="hint-box">💡 <strong>Chef's hint:</strong> ${esc(q.tip)}</div>`:''}${feedback}<div class="card-actions no-print">${selection.solved?`<button class="btn primary" id="nextBtn">${n===6?(stage===4?'FINISH THE FEAST! 🎉':'COMPLETE MISSION ✨'):'NEXT DISH →'}</button>`:`<button class="btn secondary" id="checkBtn">CHECK MY ANSWER ✓</button><button class="btn soft small" id="hintBtn">💡 Hint</button>${q.kind==='order'?'<button class="btn outline small" id="clearBtn">↺ Clear</button>':''}${selection.attempts>=2?'<button class="skip-btn" id="revealBtn">Show answer & move on</button>':''}`}</div></div></section><aside class="chef-panel"><div class="chef-face"><img src="${HERO_SRC}" alt="The little chef"></div><div class="speech">“${esc(selection.solved?'Wonderful! One step closer to the feast!':info.chef)}”</div><div class="ingredient-box"><strong>INGREDIENT ${stage+1} / 5</strong><div class="ingredient-row">${info.icon} ${n===6?'🌟':'✦ ✦ ✦'}</div></div><p class="tip">Score: <strong>${state.score}</strong> points<br>Earn more by answering on your first try!</p></aside></div>`}
function renderStage(){let done=state.index/6, stage=done-1,info=stages[stage],score=stageScore(stage),stars=stageStars(stage);return `<div class="center-wrap"><div class="eyebrow">MISSION ${String(done).padStart(2,'0')} COMPLETE</div><div class="big-emoji">${info.icon}🏆</div><h2>${info.name} — completed!</h2><div class="rating-stars" aria-label="${stars} of 3 stars">${starString(stars)}</div><p class="mission-hint">Chef says: <strong>“Magnifique! You've collected ${info.badge.toLowerCase()}!”</strong><br>Keep cooking — more grammar adventures ahead.</p><div class="summary-box"><div class="summary-item"><strong>${score}/60</strong><small>Mission points</small></div><div class="summary-item"><strong>${state.score}</strong><small>Total points</small></div><div class="summary-item"><strong>${state.index}/30</strong><small>Tasks complete</small></div></div><button class="btn primary no-print" id="continueStage">NEXT MISSION →</button><button class="skip-btn no-print" id="resetBtn">Restart entire game</button></div>`}
function renderFinish(){let perfect=state.earned.filter(x=>x===10).length,percentage=Math.round(state.score/300*100),totalStars=[0,1,2,3,4].reduce((a,i)=>a+stageStars(i),0);return `<div class="center-wrap"><div class="eyebrow">✦ YOUR FINAL RECIPE ✦</div><div class="big-emoji">🎂🏆</div><h2>You are a Grammar Chef!</h2><p class="mission-hint">The future feast is ready. You can now talk about plans and predictions with <strong>be going to</strong>!</p><div class="summary-box"><div class="summary-item"><strong>${state.score}/300</strong><small>Total points</small></div><div class="summary-item"><strong>${perfect}</strong><small>Perfect answers</small></div><div class="summary-item"><strong>${totalStars}/15</strong><small>Stars collected</small></div></div><div class="result-list">${stages.map((s,i)=>`<div class="result-item"><div class="r-icon">${s.icon}</div><div class="r-star">${'★'.repeat(stageStars(i))}</div><small>${esc(s.short)}</small></div>`).join('')}</div><div class="certificate" id="certificate"><div class="cert-title">LITTLE CHEF'S COOKING ACADEMY</div><h3>Certificate of Achievement</h3><div>Presented to <strong>our amazing grammar chef</strong></div><p style="font-family:Georgia,serif;font-size:20px;color:#b44c5c;margin:13px 0 8px">Going To Kitchen</p><div>For completing <strong>30 English grammar challenges</strong></div><div style="margin:13px 0;font-size:24px">${'⭐'.repeat(Math.max(1,Math.floor(totalStars/5)))}</div><small>Final result: ${state.score} / 300 points (${percentage}%)</small></div><div class="free-prompt"><label for="bonus">🎤 BONUS · Speak like a chef!</label><p class="tip" style="font-size:13px">Tell your teacher: What are you going to cook this weekend? What aren't you going to cook? Look at a rainy sky — what is going to happen?</p><textarea id="bonus" placeholder="I'm going to... / I'm not going to... / It is going to...">${esc(state.bonus||'')}</textarea><div class="button-row no-print"><button class="btn secondary small" id="copyResults">📋 Copy my results</button><button class="btn outline small" id="printCert">🖨️ Print certificate</button><button class="btn soft small" id="restartBtn">↺ Play again</button></div></div></div>`}
function render(){headerScore.textContent=`⭐ ${state.score} POINTS`;soundBtn.textContent=state.sound?'🔊':'🔇';view.innerHTML=state.screen==='intro'?renderIntro():state.screen==='play'?renderPlay():state.screen==='stage'?renderStage():renderFinish();bind();}
function bind(){const get=id=>document.getElementById(id);if(state.screen==='intro'){get('playBtn').onclick=()=>{if(state.index>0||state.earned.length>0){if(!confirm('Start over and replace your saved progress?'))return}startNew()};if(get('continueBtn'))get('continueBtn').onclick=continueGame;return}
if(state.screen==='stage'){get('continueStage').onclick=()=>{state.screen='play';resetQuestion();save();render()};get('resetBtn').onclick=finishReset;return}
if(state.screen==='finish'){get('bonus').addEventListener('input',e=>{state.bonus=e.target.value;save()});get('copyResults').onclick=()=>{const s=`GOING TO KITCHEN 🐭\nScore: ${state.score}/300\nPerfect answers: ${state.earned.filter(x=>x===10).length}/30\nMission stars: ${stages.map((st,i)=>`${st.name}: ${stageStars(i)}/3`).join(' | ')}\nMy speaking challenge:\n${state.bonus||'(not written yet)'}`;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>alert('Results copied!')).catch(()=>fallbackCopy(s))}else fallbackCopy(s)};get('printCert').onclick=()=>window.print();get('restartBtn').onclick=finishReset;return}
// play events
view.querySelectorAll('[data-choice]').forEach(el=>el.addEventListener('click',()=>{selection.option=Number(el.dataset.choice);selection.feedback=null;render()}));
view.querySelectorAll('[data-tile]').forEach(el=>el.addEventListener('click',()=>{let k=Number(el.dataset.tile);if(!selection.tiles.includes(k)){selection.tiles.push(k);selection.feedback=null;render()}}));
view.querySelectorAll('[data-undo]').forEach(el=>el.addEventListener('click',()=>{selection.tiles.splice(Number(el.dataset.undo),1);selection.feedback=null;render()}));
view.querySelectorAll('[data-mode]').forEach(el=>el.addEventListener('click',()=>{selection.mode=el.dataset.mode;selection.feedback=null;let text=get('written')?.value||selection.text;selection.text=text;render();get('written')?.focus()}));
if(get('written')){get('written').addEventListener('input',e=>selection.text=e.target.value);get('written').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}})}
if(get('checkBtn'))get('checkBtn').onclick=check;
if(get('hintBtn'))get('hintBtn').onclick=()=>{selection.text=get('written')?.value||selection.text;selection.hint=true;render();get('written')?.focus()};
if(get('clearBtn'))get('clearBtn').onclick=()=>{selection.tiles=[];selection.feedback=null;render()};
if(get('revealBtn'))get('revealBtn').onclick=reveal;
if(get('nextBtn'))get('nextBtn').onclick=advance;
}
function fallbackCopy(s){let t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();try{document.execCommand('copy');alert('Results copied!')}catch(e){alert('Copy is not available here. You can select the results manually.')}t.remove()}
function check(){if(selection.solved)return;let q=data[state.index],correct=false,display='';if(q.kind==='choice'){if(selection.option===null){selection.feedback={good:false,text:'Choose an answer first.'};render();return}correct=selection.option===q.correct;display=q.explain}
else if(q.kind==='order'){if(selection.tiles.length!==q.tokens.length){selection.feedback={good:false,text:'Use all the words to build the complete sentence.'};render();return}let val=selection.tiles.map(i=>q.tokens[i]).join(' ');correct=norm(val)===norm(q.answer);display=q.answer}
else{selection.text=document.getElementById('written')?.value||selection.text;if(selection.mode===null){selection.feedback={good:false,text:'Choose “A plan” or “A prediction” first.'};render();return}if(!selection.text.trim()){selection.feedback={good:false,text:'Write a sentence using the clues.'};render();return}correct=selection.mode===q.mode&&[q.answer,...q.alternates].some(s=>norm(s)===norm(selection.text));display=q.answer}
if(correct){let pts=selection.attempts===0&&!selection.hint?10:selection.attempts<=1?7:4;state.score+=pts;state.earned.push(pts);selection.solved=true;selection.feedback={good:true,text:`${q.kind==='write'?'Correct — this is a '+q.mode+'! ':''}${display}  +${pts} points!`};save();sound('good');render();}
else{selection.attempts++;let msg=selection.attempts<2?'Think about am / is / are, word order, and the base verb.':'You can try again, use a hint, or see the answer.';if(q.kind==='write'&&selection.mode!==q.mode)msg='Check whether it is a planned decision or a prediction based on what you see. '+msg;selection.feedback={good:false,text:msg};sound('bad');render()}}
function reveal(){let q=data[state.index];selection.solved=true;state.earned.push(0);selection.feedback={good:true,text:`Chef's answer: ${q.kind==='choice'?q.options[q.correct]:q.answer}${q.kind==='write'?' ('+q.mode+')':''} No points for this dish — keep practising!`};save();render()}
function advance(){if(!selection.solved)return;let oldStage=currentStage();state.index++;if(state.index===30){state.screen='finish';sound('win')}else if(state.index%6===0){state.screen='stage';sound('win')}else state.screen='play';resetQuestion();save();render();view.scrollIntoView({behavior:'smooth',block:'start'})}
load();render();
</script>
